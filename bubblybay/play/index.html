<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bubbly Bay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      [hidden] { display: none !important; }
      .x-preload { position: absolute; width: 0; height: 0; overflow: hidden; }
      body { overflow: hidden; }
      html:lang(ja), html:lang(ko), html:lang(zh) {
        --sans: "Geist", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      .x-app {
        position: fixed; inset: 0; overflow: hidden; color: var(--hero-text);
        background: var(--hero-surface) url("bg_sea.jpg") center / cover no-repeat;
        font: var(--type-body); user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .x-app * { box-sizing: border-box; }
      .x-wrap { max-width: 460px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
      .x-top { display: flex; gap: 8px; align-items: center; justify-content: flex-end; min-height: var(--tap); }
      .x-top__spacer { flex: 1; }
      .x-badge {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: var(--tap);
        border-radius: var(--r-pill); background: var(--hero-glass); border: 1px solid var(--hero-glass-stroke);
        backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); font: var(--type-label);
      }
      .x-badge small { font: var(--type-caption); color: var(--hero-text-muted); font-variant-numeric: tabular-nums; }
      .x-screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
      .x-screen.is-on { display: flex; }
      .x-btn {
        appearance: none; border: 1px solid var(--hero-glass-stroke); cursor: pointer; font: var(--type-body-strong);
        min-height: var(--tap); padding: 10px 20px; border-radius: var(--r-pill);
        background: var(--fill-primary-on); color: var(--text-primary);
        transition: transform var(--dur-quick) var(--ease-out), opacity var(--dur-quick);
      }
      .x-btn:active { transform: scale(0.96); }
      .x-btn--big { font: var(--type-heading); min-height: 56px; width: min(280px, 100%); }
      .x-btn--ghost { background: var(--hero-glass); color: var(--hero-text); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); }
      .x-btn[disabled] { opacity: 0.5; cursor: default; }
      .x-iconbtn { min-width: var(--tap); padding: 8px 12px; }

      /* Home */
      .x-home { align-items: center; justify-content: center; gap: 14px; text-align: center; }
      .x-title { font: var(--type-display); margin: 0; letter-spacing: -0.01em; text-shadow: 0 2px 16px var(--hero-scrim-strong); }
      .x-sub { margin: 0 0 18px; color: var(--hero-text-muted); font: var(--type-lede); text-shadow: 0 1px 10px var(--hero-scrim-strong); }
      .x-mascots { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
      .x-mascots .x-bub { width: 52px; height: 52px; position: relative; animation: x-bob 3s ease-in-out infinite; }
      .x-mascots .x-bub:nth-child(2n) { animation-delay: -1.5s; }
      @keyframes x-bob { 50% { transform: translateY(-8px); } }

      /* Panels */
      .x-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
      .x-head h2 { margin: 0; font: var(--type-heading); flex: 1; text-shadow: 0 1px 10px var(--hero-scrim-strong); }
      .x-panel {
        background: var(--hero-glass); border: 1px solid var(--hero-glass-stroke); border-radius: var(--r-l);
        backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); padding: 14px;
      }

      /* Level select */
      /* Seabed map */
      .x-top { position: relative; z-index: 3; }
      #s-levels.is-on { display: block; position: absolute; inset: 0; z-index: 1; }
      .x-mapscroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: calc(72px + env(safe-area-inset-bottom)); background: #f3dfae; }
      .x-mapscroll::-webkit-scrollbar { display: none; }
      .x-map { position: relative; width: 100%; max-width: 460px; margin: 0 auto; aspect-ratio: 720 / 2580; overflow: hidden; contain: layout paint; }
      .x-map__bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
      .x-copy { position: absolute; left: 0; width: 100%; }
      .x-copy.is-flip > .x-map__bg { transform: scaleX(-1); }
      .x-copy__nodes { position: absolute; inset: 0; }
      .x-copy__tint { position: absolute; inset: 0; pointer-events: none; background: var(--tint, transparent); }
      .x-zone { position: absolute; z-index: 3; transform: translate(-50%, -50%); white-space: nowrap; padding: 6px 14px; border-radius: var(--r-pill); background: rgb(11 34 56 / 0.78); color: #fff; font: var(--type-label); font-weight: var(--weight-bold); box-shadow: 0 0 0 2px rgb(255 255 255 / 0.7), 0 4px 10px rgb(0 0 0 / 0.3); pointer-events: none; }
      .x-zone b { color: #ffd23f; font-weight: inherit; }
      #map-src { display: none; }
      .x-life { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
      .x-lane { position: absolute; left: 0; width: 100%; will-change: transform; animation: x-lane var(--d, 24s) linear infinite; animation-delay: var(--dl, 0s); }
      .x-lane > img { display: block; width: var(--s, 50px); height: auto; opacity: var(--o, 1); animation: x-faceR var(--d, 24s) step-end infinite; animation-delay: var(--dl, 0s); }
      .x-lane.is-left > img { animation-name: x-faceL; }
      @keyframes x-lane { 0%, 100% { transform: translateX(-4%); } 50% { transform: translateX(84%); } }
      @keyframes x-faceR { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
      @keyframes x-faceL { 0% { transform: scaleX(-1); } 50% { transform: scaleX(1); } }
      .x-lane.is-crab { animation: x-crab var(--d, 18s) ease-in-out infinite alternate; }
      .x-lane.is-crab > img { animation: x-scuttle 0.5s ease-in-out infinite alternate; }
      @keyframes x-crab { from { transform: translateX(6%); } to { transform: translateX(70%); } }
      @keyframes x-scuttle { to { transform: translateY(-3px) rotate(4deg); } }
      .x-jelly { position: absolute; width: var(--s, 46px); opacity: var(--o, 1); will-change: transform; animation: x-jbob var(--d, 5s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
      @keyframes x-jbob { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-46px) rotate(4deg); } }
      .x-rise { position: absolute; width: var(--s, 10px); height: var(--s, 10px); border-radius: 50%; border: 1.5px solid rgb(255 255 255 / 0.7); background: radial-gradient(circle at 32% 30%, rgb(255 255 255 / 0.8) 0 18%, rgb(255 255 255 / 0.12) 40%); opacity: 0; will-change: transform, opacity; animation: x-rise var(--d, 7s) linear infinite; animation-delay: var(--dl, 0s); }
      @keyframes x-rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 0.9; } 50% { transform: translate(8px, -160px); } 90% { opacity: 0.7; } 100% { transform: translate(-6px, -320px); opacity: 0; } }
      .x-node {
        appearance: none; border: 0; padding: 0; cursor: pointer; position: absolute; z-index: 2; width: 56px; height: 56px; border-radius: 50%;
        transform: translate(-50%, -50%); display: grid; place-items: center; color: #fff;
        background: radial-gradient(circle at 32% 26%, #fff 0 9%, rgb(255 255 255 / 0.75) 20%, rgb(120 210 255 / 0.9) 58%, #1f8fd6 100%);
        box-shadow: inset 0 -6px 12px rgb(10 70 140 / 0.45), inset 0 0 0 2px rgb(255 255 255 / 0.7), 0 5px 12px rgb(0 0 0 / 0.3);
      }
      .x-node:active { transform: translate(-50%, -50%) scale(0.94); }
      .x-node__n { position: relative; font-size: 26px; font-weight: 800; line-height: 1; color: #fff; -webkit-text-stroke: 2px #0b2238; paint-order: stroke fill; text-shadow: 0 2px 0 #0b2238; }
      .x-node.is-done { background: radial-gradient(circle at 32% 26%, #fff 0 9%, rgb(255 255 255 / 0.75) 20%, rgb(255 222 120 / 0.95) 58%, #e9a21a 100%); box-shadow: inset 0 -6px 12px rgb(140 80 0 / 0.45), inset 0 0 0 2px rgb(255 255 255 / 0.7), 0 5px 12px rgb(0 0 0 / 0.3); }
      .x-node.is-locked { cursor: default; background: radial-gradient(circle at 32% 26%, #fff 0 8%, rgb(230 236 240 / 0.8) 22%, #9aa6b0 62%, #66717c 100%); box-shadow: inset 0 -6px 12px rgb(30 40 50 / 0.45), inset 0 0 0 2px rgb(255 255 255 / 0.5), 0 4px 10px rgb(0 0 0 / 0.25); }
      .x-node.is-locked .x-node__n { color: #e4e9ee; -webkit-text-stroke-color: #3c4650; text-shadow: 0 2px 0 #3c4650; }
      .x-node__lock { position: absolute; right: -4px; top: -4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: #3c4650; box-shadow: 0 0 0 2px #fff; }
      .x-node.is-shark { width: 68px; height: 68px; background: none; box-shadow: none; }
      .x-node.is-shark.is-locked { background: none; box-shadow: none; }
      .x-node.is-shark.is-locked .x-node__shark { filter: grayscale(1) brightness(0.8); }
      .x-node__shark { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
      .x-node.is-shark .x-node__n { font-size: 28px; }
      .x-node.is-boss::before { content: "👑"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 18px; }
      .x-node.is-current::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #ffd23f; animation: x-ring 1.4s ease-out infinite; pointer-events: none; }
      .x-node.is-current { animation: x-pulse 1.4s ease-in-out infinite; }
      @keyframes x-pulse { 50% { transform: translate(-50%, -50%) scale(1.08); } }
      @keyframes x-ring { from { transform: scale(0.95); opacity: 1; } to { transform: scale(1.45); opacity: 0; } }
      .x-node__stars { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: -4px; white-space: nowrap; font-size: 14px; line-height: 1; letter-spacing: 1px; -webkit-text-stroke: 1px rgb(60 40 0 / 0.6); }
      .x-node__stars .x-star:not(.is-on) { color: rgb(255 255 255 / 0.6); }
      .x-turtle { position: absolute; z-index: 3; width: 48px; height: auto; pointer-events: none; transform: translate(-50%, -50%); }
      .x-turtle img { display: block; width: 100%; height: auto; animation: x-tbob 1.6s ease-in-out infinite alternate; filter: drop-shadow(0 3px 4px rgb(0 0 0 / 0.35)); }
      .x-turtle.is-gold img { filter: sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px rgb(255 210 63 / 0.9)); }
      .x-turtle.is-left img { transform: scaleX(-1); animation-name: x-tbobL; }
      @keyframes x-tbob { to { transform: translateY(-6px); } }
      @keyframes x-tbobL { from { transform: scaleX(-1); } to { transform: scaleX(-1) translateY(-6px); } }
      .x-tabs {
        position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4; display: none;
        width: min(440px, calc(100% - 20px)); gap: 6px; padding: 6px; border-radius: var(--r-pill);
        background: var(--hero-glass); border: 1px solid var(--hero-glass-stroke); backdrop-filter: var(--hark-blur); -webkit-backdrop-filter: var(--hark-blur); box-shadow: 0 6px 20px rgb(0 0 0 / 0.25);
      }
      .x-app.has-tabs .x-tabs { display: flex; }
      .x-tab { flex: 1; appearance: none; border: 0; cursor: pointer; min-height: var(--tap); border-radius: var(--r-pill); background: none; color: var(--hero-text); font: var(--type-body-strong); }
      .x-tab[aria-current="page"] { background: var(--fill-primary-on); color: var(--text-primary); }
      .x-app.has-tabs .x-toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
      .x-app.has-tabs #s-shop { padding-bottom: 66px; }
      @media (prefers-reduced-motion: reduce) { .x-lane, .x-lane > img, .x-jelly, .x-rise, .x-node.is-current, .x-node.is-current::after, .x-turtle img { animation: none !important; } .x-rise { display: none; } }
      .x-boss { display: inline-block; margin: 0 0 6px; padding: 4px 12px; border-radius: var(--r-pill); background: #ffd23f; color: #16324f; font: var(--type-label); font-weight: var(--weight-bold); }
      .x-shark { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 6px; font: var(--type-label); font-weight: var(--weight-bold); color: #ff6b6b; }
      .x-shark img { width: 56px; height: 56px; object-fit: contain; }
      .x-skip { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; font: var(--type-heading); min-height: 60px; padding: 12px 34px; background: #ffd23f; color: #16324f; border-color: transparent; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35); }
      .x-skip:active { transform: translateX(-50%) scale(0.96); }
      .x-skip[hidden] { display: none; }
      .x-star { color: rgb(255 255 255 / 0.35); }
      .x-star.is-on { color: #ffd23f; text-shadow: 0 0 6px rgb(255 190 0 / 0.7); }

      /* Game HUD */
      .x-hud { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 4px 0 10px; }
      .x-moves { text-align: center; min-width: 64px; padding: 6px 10px; }
      .x-moves b { display: block; font: var(--type-figure); line-height: 1; }
      .x-moves span, .x-goal span { font: var(--type-caption); color: var(--hero-text-muted); }
      .x-goal { padding: 8px 12px; }
      .x-goal__row { display: flex; justify-content: space-between; font: var(--type-label); font-variant-numeric: tabular-nums; }
      .x-bar { position: relative; height: 10px; border-radius: var(--r-pill); background: rgb(255 255 255 / 0.2); margin-top: 6px; overflow: visible; }
      .x-bar__fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5fe0ff, #ffd23f); width: 0; transition: width 0.4s var(--ease-out); }
      .x-bar__mark { position: absolute; top: -5px; font-size: 13px; line-height: 1; transform: translateX(-50%); }
      .x-gamebar { display: flex; gap: 8px; justify-content: center; margin-top: 10px; min-height: var(--tap); }
      .x-objs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .x-obj { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 3px; border-radius: var(--r-pill); background: rgb(255 255 255 / 0.18); font: var(--type-label); font-variant-numeric: tabular-nums; }
      .x-obj.is-done { background: rgb(125 255 154 / 0.35); }
      .x-obj img, .x-obj__ico { width: 22px; height: 22px; border-radius: 50%; object-fit: contain; display: inline-grid; place-items: center; font-size: 13px; }
      .x-ico-striped { background: repeating-linear-gradient(to bottom, rgb(255 255 255 / 0.95) 0 3px, rgb(255 90 140 / 0.85) 3px 6px); box-shadow: 0 0 0 1px rgb(255 90 140 / 0.9); }
      .x-ico-pearl { background: conic-gradient(#ff6b8b, #ffd23f, #7dff9a, #5fe0ff, #a98bff, #ff6b8b); }
      .x-card .x-objs { justify-content: center; margin: 0 0 12px; }
      .x-card .x-obj { background: var(--fill-tertiary); color: var(--text-primary); }
      .x-btn[aria-pressed="true"] { background: #ffd23f; color: #1d1d1f; }
      .x-board.x-aim { cursor: crosshair; box-shadow: 0 0 0 3px #ffd23f, 0 0 26px 6px rgb(255 210 63 / 0.75); animation: x-aimglow 1.2s ease-in-out infinite; }
      @keyframes x-aimglow { 50% { box-shadow: 0 0 0 3px #ffd23f, 0 0 12px 2px rgb(255 210 63 / 0.4); } }

      /* Board */
      .x-boardwrap { flex: 1; display: grid; place-items: center; min-height: 0; }
      .x-board {
        position: relative; width: var(--bs); height: var(--bs); border-radius: var(--r-l); overflow: hidden;
        background: rgb(10 40 80 / 0.35); border: 1px solid var(--hero-glass-stroke);
        backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); touch-action: none;
      }
      .x-tile { position: absolute; top: 0; left: 0; width: calc(100% / 7); height: calc(100% / 7); padding: 3px; transition: transform 0.22s var(--ease-out); will-change: transform; }
      .x-tile.is-fall { transition: transform 0.3s cubic-bezier(0.5, 0, 0.6, 1.2); }
      .x-bub {
        width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
        background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / 0.95) 0 10%, rgb(255 255 255 / 0.55) 28%, rgb(200 235 255 / 0.35) 62%, rgb(160 215 255 / 0.55) 100%);
        box-shadow: inset 0 -4px 10px rgb(60 150 230 / 0.35), inset 0 0 0 1px rgb(255 255 255 / 0.6);
        transition: transform var(--dur-quick) var(--ease-out), opacity 0.25s;
      }
      .x-bub img { width: 82%; height: 82%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
      .x-tile.is-sel .x-bub { transform: scale(1.12); box-shadow: inset 0 -4px 10px rgb(60 150 230 / 0.35), 0 0 0 3px #ffd23f, 0 0 14px rgb(255 210 63 / 0.8); }
      .x-tile.is-pop .x-bub { animation: x-pop 0.26s ease-in forwards; }
      @keyframes x-pop { 40% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.1); opacity: 0; } }
      .x-tile.is-hint .x-bub { animation: x-hint 0.8s ease-in-out 3; }
      @keyframes x-hint { 50% { transform: scale(1.15); } }
      .x-float { position: absolute; pointer-events: none; font: var(--type-heading); color: #fff; text-shadow: 0 2px 8px rgb(0 0 0 / 0.6); animation: x-up 0.8s ease-out forwards; transform: translate(-50%, -50%); }
      @keyframes x-up { to { opacity: 0; margin-top: -36px; } }
      /* Special bubbles */
      .x-bub { position: relative; }
      .x-sp-h .x-bub::after, .x-sp-v .x-bub::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0.8; }
      .x-sp-h .x-bub::after { background: repeating-linear-gradient(to bottom, transparent 0 4px, rgb(255 255 255 / 0.85) 4px 7px, rgb(255 90 140 / 0.55) 7px 9px); }
      .x-sp-v .x-bub::after { background: repeating-linear-gradient(to right, transparent 0 4px, rgb(255 255 255 / 0.85) 4px 7px, rgb(255 90 140 / 0.55) 7px 9px); }
      .x-sp-h .x-bub, .x-sp-v .x-bub { box-shadow: inset 0 -4px 10px rgb(60 150 230 / 0.35), 0 0 0 2px rgb(255 90 140 / 0.9); }
      .x-sp-bomb .x-bub { box-shadow: inset 0 -4px 10px rgb(60 150 230 / 0.35), 0 0 0 3px #ffb43d, 0 0 14px 4px rgb(255 170 60 / 0.85); animation: x-glow 1.2s ease-in-out infinite; }
      @keyframes x-glow { 50% { box-shadow: inset 0 -4px 10px rgb(60 150 230 / 0.35), 0 0 0 3px #ffd23f, 0 0 22px 7px rgb(255 210 63 / 0.95); } }
      .x-rainbow {
        background: radial-gradient(circle at 32% 28%, #fff 0 10%, rgb(255 255 255 / 0.4) 26%, transparent 46%), conic-gradient(#ff6b8b, #ffd23f, #7dff9a, #5fe0ff, #a98bff, #ff6b8b) !important;
        box-shadow: inset 0 -4px 10px rgb(80 40 160 / 0.35), 0 0 12px 3px rgb(255 255 255 / 0.7) !important; animation: x-hue 3s linear infinite;
      }
      @keyframes x-hue { to { filter: hue-rotate(360deg); } }
      .x-tile.is-pop .x-bub { animation: x-pop 0.26s ease-in forwards !important; }
      .x-tile.is-new .x-bub { animation: x-grow 0.3s var(--ease-out); }
      @keyframes x-grow { from { transform: scale(0.2); } }
      .x-cheer { position: absolute; left: 50%; top: 45%; z-index: 3; pointer-events: none; white-space: nowrap; font: var(--type-display); color: #ffd23f; text-shadow: 0 3px 0 #c2570f, 0 6px 18px rgb(0 0 0 / 0.5); animation: x-cheer 1s var(--ease-out) forwards; transform: translate(-50%, -50%); }
      @keyframes x-cheer { 0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .x-rainbow, .x-sp-bomb .x-bub { animation: none; } }
      /* Pez Guía */
      .x-sp-fish .x-bub { box-shadow: inset 0 -4px 10px rgb(60 150 230 / 0.35), 0 0 0 2px #5fe0ff, 0 0 10px 2px rgb(95 224 255 / 0.7); }
      .x-sp-fish .x-bub::after {
        content: "🐠"; position: absolute; right: -3px; bottom: -3px; width: 46%; height: 46%; display: grid; place-items: center;
        font-size: 12px; line-height: 1; border-radius: 50%; background: #0b3a6b; box-shadow: 0 0 0 1.5px #5fe0ff; pointer-events: none;
      }
      .x-sand, .x-net { position: absolute; top: 0; left: 0; width: calc(100% / 7); height: calc(100% / 7); pointer-events: none; }
      .x-sand { padding: 2px; }
      .x-sand::before { content: ""; display: block; width: 100%; height: 100%; border-radius: var(--r-s); background: #e9cf96; box-shadow: inset 0 -3px 0 rgb(150 110 50 / 0.35); }
      .x-sand.is-2::before { background: #c9a35f; box-shadow: inset 0 -3px 0 rgb(110 75 25 / 0.45), inset 0 0 0 2px rgb(255 240 200 / 0.35); }
      .x-net { z-index: 1; padding: 3px; transition: opacity 0.26s ease-in; }
      .x-net::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 2px rgb(255 255 255 / 0.85);

          for (var s = 3; s > 0; s--) { lab.innerHTML = t("watching", { n: s }) + "<small>" + t("dont_close") + "</small>"; await sleep(1000); }
          S.lives = Math.min(MAX_LIVES, S.lives + 1); if (S.lives === MAX_LIVES) S.nextLife = 0;
          updateTop(); toast(t("video_life_toast"));
          lab.innerHTML = idle; watching = false; return true;
        }
        $("premium-btn").onclick = showPremium;
        $("video").onclick = function () { watchVideo($("video-label"), t("video_watch") + "<small>" + t("video_sub") + "</small>"); };

        // ---------- Wiring ----------
        $("play").onclick = function () { show("s-levels"); };
        $("to-shop").onclick = function () { show("s-shop"); };
        $("tab-map").onclick = function () { if (current !== "s-levels") show("s-levels"); };
        $("tab-shop").onclick = function () { if (current !== "s-shop") show("s-shop"); };
        $("coins-badge").onclick = function () { if (current !== "s-game") show("s-shop"); else toast(t("finish_level_shop")); };
        $("lives-badge").onclick = showLives;
        $("back").onclick = back;
        $("quit").onclick = quit;
        function muteUI() { var m = Sfx.isMuted(); $("mute").textContent = m ? "🔇" : "🔊"; $("mute").setAttribute("aria-pressed", m ? "true" : "false"); $("mute").setAttribute("aria-label", m ? t("aria_unmute") : t("aria_mute")); }
        $("mute").onclick = function () { Sfx.setMuted(!Sfx.isMuted()); muteUI(); };
        muteUI();
        updateTop();

        // ---------- Daily reward (7-day streak) ----------
        var DAILY = [{ c: 1 }, { h: 1 }, { c: 2 }, { l: 1 }, { c: 3 }, { h: 2 }, { c: 5, l: 1 }];
        var D = { last: "", day: 0 };
        try { var dr = JSON.parse(localStorage.getItem("bdm-daily") || "null"); if (dr && typeof dr.day === "number") D = { last: String(dr.last || ""), day: dr.day }; } catch (e) {}
        function saveDaily() { try { localStorage.setItem("bdm-daily", JSON.stringify({ last: D.last, day: D.day })); } catch (e) {} }
        function dayKey(off) { var d = new Date(); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (off || 0)); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
        function dailyClaimed() { return D.last === dayKey(0); }
        function dailyNext() { return D.last === dayKey(-1) && D.day >= 1 && D.day < 7 ? D.day + 1 : 1; }
        function rewardText(r) { var p = []; if (r.c) p.push("🪙 " + r.c); if (r.h) p.push("🔱 " + r.h); if (r.l) p.push("❤️ " + r.l); return p.join(" + "); }
        function showDailyReward() {
          var claimed = dailyClaimed(), today = claimed ? D.day : dailyNext(), boxes = "";
          for (var i = 1; i <= 7; i++) {
            var done = i < today || (claimed && i === today);
            boxes += '<div class="x-day' + (i === 7 ? " x-day--chest" : "") + (i === today ? " is-today" : "") + (done ? " is-done" : "") + '">' +
              (i === 7 ? "🎁 " : "") + t("daily_day", { n: i }) + "<b>" + rewardText(DAILY[i - 1]) + "</b></div>";
          }
          modal("<h3>🎁 " + t("daily_title") + '</h3><div class="x-daily">' + boxes + "</div>" +
            (claimed ? "<p>" + t("daily_done") + '</p><button class="x-btn x-btn--ghost" data-a="close">' + t("daily_close") + "</button>"
                     : '<button class="x-btn" data-a="claim">' + t("daily_claim") + '</button><button class="x-btn x-btn--ghost" data-a="close">' + t("daily_close") + "</button>"),
            {
              close: closeModal,
              claim: function () {
                if (dailyClaimed()) return closeModal();
                var n = dailyNext(), r = DAILY[n - 1];
                S.coins += r.c || 0; S.harpoons += r.h || 0;
                if (r.l) { S.lives += r.l; if (S.lives >= MAX_LIVES) S.nextLife = 0; }
                D.day = n; D.last = dayKey(0); saveDaily();
                updateTop(); closeModal(); toast(t("daily_got") + " " + rewardText(r));
              }
            });
        }
        $("daily-btn").onclick = showDailyReward;

        // ---------- Sea-animal album popup ----------
        var albumPage = 0;
        function showAlbum(z) {
          syncAlbum();
          if (typeof z !== "number") { z = 0; for (var q = 0; q < ALBUM_ZONES; q++) if (S.album[q] > 0) z = q; }
          albumPage = z = (z + ALBUM_ZONES) % ALBUM_ZONES;
          var n = S.album[z] || 0, cards = "", dots = "";
          for (var i = 0; i < 5; i++) {
            cards += i < n
              ? '<div class="x-acard"><span class="x-acard__em" aria-hidden="true">' + ALBUM_EMOJI[z][i] + '</span>' + t("an_" + z + "_" + i) + '</div>'
              : '<div class="x-acard is-locked"><span class="x-acard__em" aria-hidden="true">' + ALBUM_EMOJI[z][i] + '</span>?</div>';
          }
          for (var d = 0; d < ALBUM_ZONES; d++) dots += '<span' + (d === z ? ' class="is-on"' : '') + '></span>';
          var done = n >= 5 ? '<div class="x-album__done">🏆 ' + t("album_zone_done") +
            (S.albumPrize[z] ? '<br><small>' + t("album_claimed") + '</small>' : '<button class="x-btn" data-a="claim">' + t("album_claim", { n: ALBUM_PRIZE }) + '</button>') + '</div>' : '';
          modal('<div class="x-album" id="album"><h3>📖 ' + t("album_title") + '</h3>' +
            '<div class="x-album__nav"><button class="x-btn x-btn--ghost" data-a="prev" aria-label="' + t("album_prev") + '">‹</button>' +
            '<p class="x-album__zone">' + t("zone", { n: z + 1 }) + ' · <b>' + ZONES[z][0] + '</b><small>' + t("album_count", { n: n }) + '</small></p>' +
            '<button class="x-btn x-btn--ghost" data-a="next" aria-label="' + t("album_next") + '">›</button></div>' +
            '<div class="x-album__grid">' + cards + '</div>' + (n < 5 ? '<p><small>' + t("album_hint") + '</small></p>' : '') + done +
            '<div class="x-album__dots" aria-hidden="true">' + dots + '</div>' +
            '<button class="x-btn x-btn--ghost" data-a="ok">' + t("ok") + '</button></div>', {
            prev: function () { showAlbum(albumPage - 1); },
            next: function () { showAlbum(albumPage + 1); },
            claim: function () {
              if (S.albumPrize[albumPage] || S.album[albumPage] < 5) return;
              S.albumPrize[albumPage] = 1; S.coins += ALBUM_PRIZE; updateTop(); Sfx.sparkle && Sfx.sparkle();
              toast(t("album_got", { n: ALBUM_PRIZE })); showAlbum(albumPage);
            },
            ok: closeModal
          });
          var el = $("album"), sx = null, sy = 0;
          el.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; });
          el.addEventListener("pointerup", function (e) {
            if (sx == null) return; var dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) showAlbum(albumPage + (dx < 0 ? 1 : -1));
          });
          el.addEventListener("pointercancel", function () { sx = null; });
        }
        $("album-btn").onclick = function () { showAlbum(); };

        // ---------- Free daily wheel (one spin per local calendar day) ----------
        // Weights out of 100: 1 coin / 1 harpoon most likely; 3 coins and 2 harpoons rare.
        var WHEEL = [
          { c: 1, w: 26, e: "🪙", s: "1" }, { c: 2, w: 12, e: "🪙", s: "2" }, { h: 1, w: 24, e: "🔱", s: "1" }, { l: 1, w: 8, e: "❤️", s: "1" },
          { m: 3, w: 10, e: "👣", s: "+3" }, { c: 1, w: 14, e: "🪙", s: "1" }, { c: 3, w: 3, e: "🪙", s: "3" }, { h: 2, w: 3, e: "🔱", s: "2" }
        ];
        var WHEEL_COLORS = ["#0b6fa4", "#13a3c4", "#0a5a8a", "#2bc0b4", "#0b6fa4", "#13a3c4", "#0a5a8a", "#2bc0b4"];
        var wheelRot = 0, wheelBusy = false, wheelTick = null;
        function wheelSpun() { return S.lastSpinDate === dayKey(0) && (!isPremium() || P.spin === dayKey(0)); }
        function prizeText(p) {
          if (p.c) return "🪙 " + (p.c === 1 ? t("wheel_p_coin") : t("wheel_p_coins", { n: p.c }));
          if (p.h) return "🔱 " + (p.h === 1 ? t("wheel_p_harp") : t("wheel_p_harps", { n: p.h }));
          if (p.l) return "❤️ " + t("wheel_p_life");
          return "👣 " + t("wheel_p_moves");
        }
        function wheelLeft() {
          var now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((mid - now) / 1000));
          var p = function (n) { return (n < 10 ? "0" : "") + n; };
          return p(Math.floor(s / 3600)) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60);
        }
        function drawWheel(cv) {
          var ctx = cv.getContext("2d"), W = cv.width, r = W / 2, seg = Math.PI * 2 / WHEEL.length;
          WHEEL.forEach(function (p, i) {
            var a0 = -Math.PI / 2 + i * seg;
            ctx.beginPath(); ctx.moveTo(r, r); ctx.arc(r, r, r, a0, a0 + seg); ctx.closePath();
            ctx.fillStyle = WHEEL_COLORS[i]; ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 3; ctx.stroke();
            ctx.save(); ctx.translate(r, r); ctx.rotate(a0 + seg / 2 + Math.PI / 2);
            ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
            ctx.font = Math.round(W * 0.075) + "px sans-serif"; ctx.fillText(p.e, 0, -r * 0.72);
            ctx.font = "600 " + Math.round(W * 0.07) + "px Geist, sans-serif"; ctx.fillText(p.s, 0, -r * 0.5);
            ctx.restore();
          });
          for (var b = 0; b < 14; b++) { // a few bubbles for the ocean look
            var ang = b * 2.4, rad = r * (0.25 + (b % 5) * 0.03);
            ctx.beginPath(); ctx.arc(r + Math.cos(ang) * rad, r + Math.sin(ang) * rad, W * 0.008 + (b % 3), 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fill();
          }
        }
        function pickPrize() {
          var total = WHEEL.reduce(function (s, p) { return s + p.w; }, 0), x = Math.random() * total;
          for (var i = 0; i < WHEEL.length; i++) { x -= WHEEL[i].w; if (x < 0) return i; }
          return 0;
        }
        function showWheel() {
          if (wheelBusy) return;
          var spun = wheelSpun();
          modal("<h3>🎡 " + t("wheel_title") + "</h3><p>" + t("wheel_free") + "</p>" +
            '<div class="x-wheel"><canvas id="wheel-cv" width="520" height="520" role="img" aria-label="' + t("wheel_title") + '" style="transform:rotate(' + wheelRot + 'deg)"></canvas></div>' +
            '<div id="wheel-foot">' + (spun ? "<p><b>" + t("wheel_done") + '</b></p><p class="x-wheel__left" id="wheel-left">' + t("wheel_left", { time: wheelLeft() }) + "</p>"
                   : '<button class="x-btn" data-a="spin" id="wheel-spin">' + t("wheel_spin") + "</button>") + "</div>" +
            '<button class="x-btn x-btn--ghost" data-a="close" id="wheel-close">' + t("daily_close") + "</button>",
            {
              close: function () { if (!wheelBusy) closeModal(); },
              spin: function () {
                if (wheelBusy || wheelSpun()) return;
                wheelBusy = true;
                var k = pickPrize(), p = WHEEL[k];
                // Grant and save right away so a reload mid-spin neither loses nor repeats it
                if (S.lastSpinDate === dayKey(0)) { P.spin = dayKey(0); premSave(); } else S.lastSpinDate = dayKey(0);
                S.coins += p.c || 0; S.harpoons += p.h || 0; S.bonusMoves += p.m || 0;
                if (p.l) { S.lives += p.l; if (S.lives >= MAX_LIVES) S.nextLife = 0; }
                saveGame();
                var btn = $("wheel-spin"); btn.disabled = true; btn.textContent = t("wheel_spinning"); $("wheel-close").disabled = true;
                var target = 360 - (k * 45 + 22.5) + (Math.random() * 26 - 13);
                wheelRot = wheelRot - (wheelRot % 360) + 360 * 5 + target;
                $("wheel-cv").style.transform = "rotate(" + wheelRot + "deg)";
                Sfx.whoosh();
                var tt = 0, gap = 60;
                while (tt < 2700) { (function (d) { setTimeout(function () { Sfx.pop(1); }, d); })(tt); tt += gap; gap *= 1.12; }
                setTimeout(function () {
                  wheelBusy = false; Sfx.win(); updateTop();
                  toast(t("wheel_got", { prize: prizeText(p) }));
                  if ($("wheel-cv")) showWheel();
                }, 3100);
              }
            });
          var cv = $("wheel-cv"); drawWheel(cv);
          clearInterval(wheelTick);
          if (spun) wheelTick = setInterval(function () {
            var el = $("wheel-left");
            if (!el || !$("modal").classList.contains("is-on")) return clearInterval(wheelTick);
            if (!wheelSpun()) { clearInterval(wheelTick); return showWheel(); }
            el.textContent = t("wheel_left", { time: wheelLeft() });
          }, 1000);
        }
        $("wheel-btn").onclick = showWheel;
        $("chest-open").onclick = openStarChest;
        renderChest();
        if (current === "s-home" && !dailyClaimed()) showDailyReward();
      })();
    </script>
  </body>
</html>
